services:
  postgres:
    image: postgres:16
    restart: always
    mem_limit: 512m
    environment:
      POSTGRES_USER: fccpd
      POSTGRES_PASSWORD: fccpd
      POSTGRES_DB: fccpd_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fccpd -d fccpd_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    mem_limit: 256m
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build: .
    restart: always
    mem_limit: 256m
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    # A api é dona do schema de produtos/pedidos (cria e migra ao subir); o
    # healthy indica que isso terminou e libera quem depende dessas tabelas.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  recomendacoes:
    build: .
    restart: always
    # Pico medido: 242 MiB com 8 processos no recálculo (85 MiB parado). Cada
    # processo filho conta no mesmo cgroup, então mais workers = mais memória.
    mem_limit: 512m
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    command: ["uvicorn", "recomendacoes.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      # Nº de processos do recálculo. 4 = núcleos físicos da máquina do
      # benchmark, a melhor configuração medida (ver README, U2).
      RECOMENDACOES_WORKERS: "4"
    ports:
      - "8001:8001"
    volumes:
      - ./app:/code/app
      - ./estruturas:/code/estruturas
      - ./recomendacoes:/code/recomendacoes

  worker:
    build: .
    restart: always
    mem_limit: 128m
    env_file: .env
    depends_on:
      - redis
      - postgres
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./app:/code/app
    deploy:
      replicas: 3

  reconciliador:
    build: .
    restart: always
    mem_limit: 128m
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["python", "-m", "app.reconciliador"]
    volumes:
      - ./app:/code/app

  monitor:
    build: .
    restart: always
    mem_limit: 256m
    # Painel de AED + Infra de Software (http://localhost:8002), 3 níveis:
    #  1. pid: host faz o /proc do container mostrar a máquina inteira (no Docker
    #     Desktop, a VM Linux do WSL2), então o coletor enxerga todos os processos.
    #  2. docker.sock SOMENTE LEITURA: status, CPU, memória/limite, reinícios,
    #     OOMKilled e o fluxo de eventos dos containers (o monitor só faz GET).
    #  3. sondas nos serviços pela rede do compose (HTTP, RESP do Redis, Postgres).
    pid: host
    command: ["uvicorn", "monitor.servidor:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      MONITOR_SONDAS: "api=http://api:8000/,recomendacoes=http://recomendacoes:8001/,postgres=pg://postgres:5432,redis=redis://redis:6379"
      MONITOR_LIMITE_MEM: "85"
      MONITOR_LIMITE_LATENCIA_MS: "500"
    ports:
      - "8002:8002"
    volumes:
      - ./estruturas:/code/estruturas
      - ./concorrencia:/code/concorrencia
      - ./monitor:/code/monitor
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Demo de OOM (não sobe no `up` normal): docker compose --profile demo up estresse-memoria
  # Aloca 4 MB por segundo até o kernel matar o processo pelo mem_limit.
  estresse-memoria:
    build: .
    profiles: ["demo"]
    restart: "no"
    mem_limit: 128m
    memswap_limit: 128m
    command: ["python", "-m", "monitor.estresse"]
    volumes:
      - ./monitor:/code/monitor

volumes:
  pgdata:
  redisdata: