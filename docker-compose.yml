services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: fccpd
      POSTGRES_PASSWORD: fccpd
      POSTGRES_DB: fccpd_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fccpd -d fccpd_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    # A api é dona do schema de produtos/pedidos (cria e migra ao subir); o
    # healthy indica que isso terminou e libera quem depende dessas tabelas.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  recomendacoes:
    build: .
    restart: always
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    command: ["uvicorn", "recomendacoes.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - ./app:/code/app
      - ./estruturas:/code/estruturas
      - ./recomendacoes:/code/recomendacoes

  worker:
    build: .
    restart: always
    env_file: .env
    depends_on:
      - redis
      - postgres
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./app:/code/app
    deploy:
      replicas: 3

  reconciliador:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["python", "-m", "app.reconciliador"]
    volumes:
      - ./app:/code/app

volumes:
  pgdata:
  redisdata: