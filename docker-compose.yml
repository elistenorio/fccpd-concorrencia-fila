services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: fccpd
      POSTGRES_PASSWORD: fccpd
      POSTGRES_DB: fccpd_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fccpd -d fccpd_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    # A api é dona do schema de produtos/pedidos (cria e migra ao subir); o
    # healthy indica que isso terminou e libera quem depende dessas tabelas.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  recomendacoes:
    build: .
    restart: always
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    command: ["uvicorn", "recomendacoes.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      # Nº de processos do recálculo. 4 = núcleos físicos da máquina do
      # benchmark, a melhor configuração medida (ver README, U2).
      RECOMENDACOES_WORKERS: "4"
    ports:
      - "8001:8001"
    volumes:
      - ./app:/code/app
      - ./estruturas:/code/estruturas
      - ./recomendacoes:/code/recomendacoes

  # Painel de monitoramento do PI3. Sobe o coletor concorrente (3 threads
  # produtoras + 1 consumidora) no mesmo processo que serve as telas.
  monitor:
    build: .
    restart: always
    command: ["uvicorn", "monitor.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      # Serviços do nível 3 (health check): nome=url, separados por vírgula.
      MONITOR_SERVICOS: "api=http://api:8000/,recomendacoes=http://recomendacoes:8001/"
      MONITOR_INTERVALO_SO: "2"
      MONITOR_INTERVALO_CONTAINERS: "5"
      MONITOR_INTERVALO_SERVICOS: "5"
      MONITOR_DISCO: "/hostfs"
    ports:
      - "8002:8002"
    # Nível 1: sem isto, /proc mostra só os processos do próprio container.
    # Com o namespace de PID do host, o painel vê os processos da máquina
    # (em Docker Desktop, da VM que roda os containers).
    pid: host
    volumes:
      # Nível 2: a API da Docker Engine, somente leitura. É o socket do host,
      # então o monitor vê todos os containers do Compose, inclusive ele mesmo.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Nível 1: raiz do host somente leitura, só para medir o disco.
      - /:/hostfs:ro
      - ./monitor:/code/monitor
      - ./estruturas:/code/estruturas
      - ./concorrencia:/code/concorrencia
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/saude')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    restart: always
    env_file: .env
    depends_on:
      - redis
      - postgres
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./app:/code/app
    deploy:
      replicas: 3

  reconciliador:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["python", "-m", "app.reconciliador"]
    volumes:
      - ./app:/code/app

volumes:
  pgdata:
  redisdata: