name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de teste
        run: pip install -r requirements-dev.txt

      - name: Estruturas, ordenação, busca, produtor-consumidor, seed e cálculo de recomendações
        run: pytest -v

      - name: Demonstração da condição de corrida (falha se a versão COM lock errar)
        run: python -m concorrencia.demo_corrida

      - name: Sintaxe do monitor.sh
        run: bash -n scripts/monitor.sh

  integracao:
    name: Build e integração (Docker Compose)
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cliente HTTP dos scripts de teste
        run: pip install httpx==0.27.2

      - name: Build das imagens e subida de todos os serviços
        run: docker compose up -d --build --wait

      - name: Seed (volume reduzido para o CI)
        run: docker compose exec -T api python -m app.seed --produtos 300 --clientes 1500 --pedidos 12000

      - name: Recálculo das recomendações em modo paralelo
        run: curl -fsS -X POST "http://127.0.0.1:8001/recomendacoes/recalcular?modo=processos"

      - name: Teste de concorrência do checkout (Parte 1)
        run: python test_concorrencia.py

      - name: Comunicação entre serviços (REST, fila e falha do serviço de recomendações)
        run: python evidencia_comunicacao.py

      - name: Guardar a evidência gerada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-comunicacao
          path: evidencias/u2/comunicacao.txt
          if-no-files-found: ignore

      - name: Logs dos containers (se algo falhou)
        if: failure()
        run: docker compose logs --no-color
